  <g transform="translate(460, 310)">
    <rect width="60" height="60" rx="14" fill="#18181b" stroke="#f97316" stroke-width="1.5" filter="url(#glow1)"/>
    <path d="M 30 18 Q 33 25 24 30 Q 34 33 30 42 M 22 45 C 38 45 42 42 38 38 M 18 36 C 26 38 35 38 42 34" fill="none" stroke="url(#javaGrad)" stroke-width="2.5" stroke-linecap="round"/>
