    <text x="150" y="265" fill="#e4e4e7">String degree = </text>
    <text x="290" y="265" fill="#22c55e">"Computer Science"</text>
    <text x="450" y="265" fill="#e4e4e7">;</text>

    <!-- Line 6 -->
    <text x="80" y="300" fill="#656569">6</text>
    <text x="150" y="300" fill="#e4e4e7">String coreStack = </text>
    <text x="305" y="300" fill="#f97316">"Java &amp; Spring Boot"</text>
    <text x="475" y="300" fill="#e4e4e7">;</text>

    <!-- Line 7 -->
    <text x="80" y="335" fill="#656569">7</text>
    <text x="150" y="335" fill="#e4e4e7">System.out.println(</text>
    <text x="300" y="335" fill="#38bdf8">"Ready to Build!"</text>
    <text x="445" y="335" fill="#e4e4e7">);</text>

    <!-- Line 8 -->
    <text x="80" y="370" fill="#656569">8</text>
    <text x="130" y="370" fill="#e4e4e7">}</text>

    <!-- Line 9 -->
    <text x="80" y="405" fill="#656569">9</text>
    <text x="110" y="405" fill="#e4e4e7">}</text>
  </g>

  <!-- Floating Logos -->
