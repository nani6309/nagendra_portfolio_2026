  <circle cx="92" cy="65" r="5" fill="#eab308"/>
  <circle cx="109" cy="65" r="5" fill="#22c55e"/>
  <text x="300" y="69" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">JavaFullStack_2023.java</text>

