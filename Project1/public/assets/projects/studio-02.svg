<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 484" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="484" fill="url(#bg2)"/>

  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="420" x2="600" y2="420"/>

    <line x1="100" y1="0" x2="100" y2="484"/>
    <line x1="200" y1="0" x2="200" y2="484"/>
    <line x1="300" y1="0" x2="300" y2="484"/>
    <line x1="400" y1="0" x2="400" y2="484"/>
    <line x1="500" y1="0" x2="500" y2="484"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="150" cy="350" r="180" fill="#10b981" opacity="0.09" filter="url(#glow2)"/>
  <circle cx="450" cy="150" r="160" fill="#38bdf8" opacity="0.09" filter="url(#glow2)"/>

  <!-- Code Window Mockup -->
  <rect x="50" y="45" width="500" height="394" rx="12" fill="#091412" stroke="#059669" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Window Titlebar -->
  <path d="M 50 57 A 12 12 0 0 1 62 45 L 538 45 A 12 12 0 0 1 550 57 L 550 85 L 50 85 Z" fill="#064e3b"/>
  <circle cx="75" cy="65" r="5" fill="#ef4444"/>
  <circle cx="92" cy="65" r="5" fill="#eab308"/>
  <circle cx="109" cy="65" r="5" fill="#22c55e"/>
  <text x="300" y="69" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Freelance_FullStack_2024.tsx</text>

  <!-- Status Badge Top Right -->
  <rect x="360" y="105" width="165" height="28" rx="14" fill="#047857" stroke="#10b981" stroke-width="1"/>
  <text x="442" y="123" fill="#ecfdf5" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🚀 FREELANCE BUSINESS</text>

  <!-- Code Snippet -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="14" leading="1.6">
    <!-- Line 1 -->
    <text x="80" y="125" fill="#047857">1</text>
    <text x="110" y="125" fill="#f43f5e" font-weight="bold">export const</text>
    <text x="215" y="125" fill="#38bdf8" font-weight="bold">FreelanceJourney</text>
    <text x="360" y="125" fill="#e4e4e7">=</text>
    <text x="375" y="125" fill="#e4e4e7">{</text>

    <!-- Line 2 -->
    <text x="80" y="160" fill="#047857">2</text>
    <text x="130" y="160" fill="#a7f3d0">year:</text>
    <text x="180" y="160" fill="#f59e0b">2024</text>
    <text x="220" y="160" fill="#e4e4e7">,</text>

    <!-- Line 3 -->
    <text x="80" y="195" fill="#047857">3</text>
    <text x="130" y="195" fill="#a7f3d0">business:</text>
    <text x="215" y="195" fill="#34d399">"Full Stack Web Studio"</text>
    <text x="415" y="195" fill="#e4e4e7">,</text>

    <!-- Line 4 -->
    <text x="80" y="230" fill="#047857">4</text>
    <text x="130" y="230" fill="#a7f3d0">skills:</text>
    <text x="200" y="230" fill="#e4e4e7">[</text>
    <text x="215" y="230" fill="#38bdf8">"HTML/CSS/JS"</text>
    <text x="330" y="230" fill="#e4e4e7">,</text>
    <text x="345" y="230" fill="#38bdf8">"Databases"</text>
    <text x="445" y="230" fill="#e4e4e7">],</text>

    <!-- Line 5 -->
    <text x="80" y="265" fill="#047857">5</text>
    <text x="130" y="265" fill="#a7f3d0">deliverables:</text>
    <text x="255" y="265" fill="#34d399">"Fast, Scalable Apps"</text>
    <text x="445" y="265" fill="#e4e4e7">,</text>

    <!-- Line 6 -->
    <text x="80" y="300" fill="#047857">6</text>
    <text x="130" y="300" fill="#a7f3d0">growth:</text>
    <text x="205" y="300" fill="#fbbf24">"Mastered Web &amp; APIs"</text>

    <!-- Line 7 -->
    <text x="80" y="335" fill="#047857">7</text>
    <text x="110" y="335" fill="#e4e4e7">}</text>
  </g>

  <!-- HTML CSS JS Badge Bottom Right -->
  <g transform="translate(450, 310)">
    <rect width="65" height="65" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glow2)"/>
    <text x="32" y="40" fill="#34d399" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
