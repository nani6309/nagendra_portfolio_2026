<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 484" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="484" fill="url(#bg3)"/>

  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="420" x2="600" y2="420"/>

    <line x1="100" y1="0" x2="100" y2="484"/>
    <line x1="200" y1="0" x2="200" y2="484"/>
    <line x1="300" y1="0" x2="300" y2="484"/>
    <line x1="400" y1="0" x2="400" y2="484"/>
    <line x1="500" y1="0" x2="500" y2="484"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="450" cy="150" r="180" fill="#3b82f6" opacity="0.1" filter="url(#glow3)"/>
  <circle cx="150" cy="350" r="160" fill="#22c55e" opacity="0.08" filter="url(#glow3)"/>

  <!-- Code Window Mockup -->
  <rect x="50" y="45" width="500" height="394" rx="12" fill="#020617" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Window Titlebar -->
  <path d="M 50 57 A 12 12 0 0 1 62 45 L 538 45 A 12 12 0 0 1 550 57 L 550 85 L 50 85 Z" fill="#1e293b"/>
  <circle cx="75" cy="65" r="5" fill="#ef4444"/>
  <circle cx="92" cy="65" r="5" fill="#eab308"/>
  <circle cx="109" cy="65" r="5" fill="#22c55e"/>
  <text x="300" y="69" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Wipro_SDET_Automation_2025.py</text>

  <!-- Company Badge Top Right -->
  <rect x="340" y="105" width="185" height="28" rx="14" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1"/>
  <text x="432" y="123" fill="#eff6ff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🏢 WIPRO LIMITED • SDET</text>

  <!-- Code Snippet -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="14" leading="1.6">
    <!-- Line 1 -->
    <text x="80" y="125" fill="#475569">1</text>
    <text x="110" y="125" fill="#f43f5e" font-weight="bold">class</text>
    <text x="160" y="125" fill="#60a5fa" font-weight="bold">WiproSDETEngineer</text>
    <text x="325" y="125" fill="#e2e8f0">:</text>

    <!-- Line 2 -->
    <text x="80" y="160" fill="#475569">2</text>
    <text x="130" y="160" fill="#94a3b8">company =</text>
    <text x="215" y="160" fill="#4ade80">"WIPRO PRIVATE LTD"</text>

    <!-- Line 3 -->
    <text x="80" y="195" fill="#475569">3</text>
    <text x="130" y="195" fill="#94a3b8">role =</text>
    <text x="190" y="195" fill="#fbbf24">"SDET / Test Automation"</text>

    <!-- Line 4 -->
    <text x="80" y="230" fill="#475569">4</text>
    <text x="130" y="230" fill="#94a3b8">focus =</text>
    <text x="200" y="230" fill="#e2e8f0">[</text>
    <text x="215" y="230" fill="#38bdf8">"CI/CD"</text>
    <text x="270" y="230" fill="#e2e8f0">,</text>
    <text x="285" y="230" fill="#38bdf8">"Postman APIs"</text>
    <text x="400" y="230" fill="#e2e8f0">]</text>

    <!-- Line 5 -->
    <text x="80" y="265" fill="#475569">5</text>

    <!-- Line 6 -->
    <text x="80" y="300" fill="#475569">6</text>
    <text x="130" y="300" fill="#f43f5e">def</text>
    <text x="165" y="300" fill="#4ade80">run_test_suite</text>
    <text x="300" y="300" fill="#e2e8f0">(self):</text>

    <!-- Line 7 -->
    <text x="80" y="335" fill="#475569">7</text>
    <text x="160" y="335" fill="#f43f5e">return</text>
    <text x="220" y="335" fill="#4ade80">"✓ 100% TESTS PASSED"</text>
  </g>

  <!-- Pass Badge Bottom Right -->
  <g transform="translate(430, 310)">
    <rect width="90" height="65" rx="16" fill="#162e4c" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow3)"/>
    <text x="45" y="36" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">✓ PASS</text>
    <text x="45" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">2025 SDET</text>
